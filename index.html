<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MigratoryAtom79</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Apply saved theme before first paint to avoid a flash -->
  <script>
    try {
      const saved = localStorage.getItem("theme");
      if (saved) document.documentElement.dataset.theme = saved;
    } catch (e) {}
  </script>
  <!-- Include Marked.js parser library -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

<!-- Decorative background effects (see effects.js) -->
<canvas id="bg" aria-hidden="true"></canvas>
<div id="cursor-glow" class="cursor-glow" aria-hidden="true"></div>

<header>
  <div class="header-top">
    <h1 id="repo-title">Portfolio Projects</h1>
    <button id="theme-toggle" class="icon-btn" type="button"
            aria-label="Toggle light/dark theme" title="Toggle theme">◐</button>
  </div>
  <p id="age-title" title="Click to change precision"></p>
  <p id="loc-title" title="Click to change precision"></p>
  <nav id="socials" class="socials" aria-label="Profiles"></nav>
</header>

<div id="error-box" role="alert"></div>

<!-- README Section -->
<section id="readme-section" style="display: none; margin-bottom: 2.5rem; padding: 0rem;">
  <div id="readme-content" class="markdown-body"></div>
</section>

<section>
  <h2>Directories &amp; Demos</h2>

  <div class="toolbar">
    <div class="search-wrap">
      <input id="search" type="search" placeholder="Search projects…  (press / to focus)"
             autocomplete="off" aria-label="Search projects">
      <span id="count" class="count" aria-live="polite"></span>
    </div>

    <select id="sort" aria-label="Sort projects">
      <option value="default">Default order</option>
      <option value="az">Name A → Z</option>
      <option value="za">Name Z → A</option>
      <option value="repo">By repository</option>
    </select>

    <div class="view-toggle" role="group" aria-label="Layout">
      <button id="view-grid" class="icon-btn active" type="button" title="Grid view" aria-pressed="true">▦</button>
      <button id="view-list" class="icon-btn" type="button" title="List view" aria-pressed="false">☰</button>
    </div>

    <button id="surprise" class="btn" type="button" disabled>🎲 Surprise me</button>
  </div>

  <div id="grid" class="project-grid">
    <div class="status-msg">Scanning repository directories...</div>
  </div>
</section>

<script type="module" src="script.js"></script>
<script src="effects.js" defer></script>
</body>
</html>
